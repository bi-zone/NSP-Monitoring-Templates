zabbix_export:
  templates:
  - uuid: 2fd35a64ef22435096f92dc667e757c7
    template: BI.ZONE Secure SD-WAN. Discovery template
    name: BI.ZONE Secure SD-WAN. Discovery template
    groups:
    - name: BI.ZONE Secure SD-WAN
    items:
    - uuid: 7a556567e9a546e998b6c6a81690e8c6
      name: Get CPE list
      type: HTTP_AGENT
      key: get.cpe.list
      history: '0'
      trends: '0'
      value_type: TEXT
      timeout: 30s
      url: '{$PROTO}://mon.{$DOMAIN}/mon/cpe-list'
      ssl_cert_file: '{$SSL_CERT}'
      ssl_key_file: '{$SSL_KEY}'
    - uuid: 260ce1120d494015960c436052ab5326
      name: Get CSP list
      type: HTTP_AGENT
      key: get.csp.list
      history: '0'
      trends: '0'
      value_type: TEXT
      timeout: 30s
      url: '{$PROTO}://mon.{$DOMAIN}/mon/csp'
      ssl_cert_file: '{$SSL_CERT}'
      ssl_key_file: '{$SSL_KEY}'
    - uuid: e7066f7cc8764797853d7368783b6bb7
      name: 'CSP portal certificate: Get'
      type: EXTERNAL
      key: csp_ui_cert.sh[{$SSL_CERT},{$UI.CERT.CERT_DIR}]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      description: Reads portal PEM from Zabbix server local path {$UI.CERT.CERT_DIR}/{$SSL_CERT} (no network).
        Requires csp_ui_cert.sh in ExternalScripts.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 6h
    - uuid: 826810e9412141bbb29f319f567ce1a8
      name: 'CSP portal certificate: Validation result'
      type: DEPENDENT
      key: csp.ui.cert.validation
      delay: '0'
      history: 7d
      trends: '0'
      value_type: CHAR
      description: 'Portal PEM validation: valid / invalid / valid-but-self-signed'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.result.value
      master_item:
        key: csp_ui_cert.sh[{$SSL_CERT},{$UI.CERT.CERT_DIR}]
      triggers:
      - uuid: 3c4b6d93e8784bb4aca8a0f55c6320ff
        expression: find(/BI.ZONE Secure SD-WAN. Discovery template/csp.ui.cert.validation,,"like","invalid")=1
          and last(/BI.ZONE Secure SD-WAN. Discovery template/csp.ui.cert.not_after)>=now() and {$UI.CERT.INVALID.ALERT}=1
        name: UiCertInvalid
        priority: HIGH
        description: |-
          Portal certificate file is invalid (not yet valid / broken). Enable only for custom certs via {$UI.CERT.INVALID.ALERT}=1 (default 0).

          File: {$UI.CERT.CERT_DIR}/{$SSL_CERT}
    - uuid: 592a3f05e3984039b1cca73b56d7715a
      name: 'CSP portal certificate: Last validation status'
      type: DEPENDENT
      key: csp.ui.cert.message
      delay: '0'
      history: 7d
      trends: '0'
      value_type: CHAR
      description: Message from the latest portal certificate file check
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.result.message
      master_item:
        key: csp_ui_cert.sh[{$SSL_CERT},{$UI.CERT.CERT_DIR}]
    - uuid: ba74a5ccce71489c81d3af56df62f7bf
      name: 'CSP portal certificate: Expires on'
      type: DEPENDENT
      key: csp.ui.cert.not_after
      delay: '0'
      history: 7d
      trends: '0'
      value_type: FLOAT
      units: unixtime
      description: notAfter of portal PEM on Zabbix server (Unix timestamp)
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.x509.not_after.timestamp
      master_item:
        key: csp_ui_cert.sh[{$SSL_CERT},{$UI.CERT.CERT_DIR}]
      triggers:
      - uuid: 7e5aa50292eb44ca89f18dcae063eb39
        expression: last(/BI.ZONE Secure SD-WAN. Discovery template/csp.ui.cert.not_after)<now()
        name: UiCertExpired
        priority: HIGH
        description: |-
          Portal certificate PEM has expired. Renew {$SSL_CERT} on Zabbix server (and matching key). Monitoring/mTLS to CSP will fail.

          File: {$UI.CERT.CERT_DIR}/{$SSL_CERT}
      - uuid: ecde2ab33be349acafb4f02d6158f5d0
        expression: (last(/BI.ZONE Secure SD-WAN. Discovery template/csp.ui.cert.not_after)-now())/86400<{$UI.CERT.EXPIRY.WARN}
          and last(/BI.ZONE Secure SD-WAN. Discovery template/csp.ui.cert.not_after)>=now()
        name: UiCertExpiresSoon
        priority: WARNING
        description: |-
          Portal certificate PEM expires in less than {$UI.CERT.EXPIRY.WARN} days. Renew {$SSL_CERT} before expiry.

          File: {$UI.CERT.CERT_DIR}/{$SSL_CERT}
        dependencies:
        - name: UiCertExpired
          expression: last(/BI.ZONE Secure SD-WAN. Discovery template/csp.ui.cert.not_after)<now()
    - uuid: e613c0107649461b8499034140f395f6
      name: 'CSP portal certificate: Issuer'
      type: DEPENDENT
      key: csp.ui.cert.issuer
      delay: '0'
      history: 7d
      trends: '0'
      value_type: CHAR
      description: Issuer of the portal PEM
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.x509.issuer
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: csp_ui_cert.sh[{$SSL_CERT},{$UI.CERT.CERT_DIR}]
    - uuid: e8fa2aaaaee14ab794b8f0be7c4dbaf3
      name: 'CSP portal certificate: Subject'
      type: DEPENDENT
      key: csp.ui.cert.subject
      delay: '0'
      history: 7d
      trends: '0'
      value_type: CHAR
      description: Subject of the portal PEM
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.x509.subject
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: csp_ui_cert.sh[{$SSL_CERT},{$UI.CERT.CERT_DIR}]
    - uuid: 53b0ab7006114863ba06ee24969a86a8
      name: 'RAVPN connections: online'
      type: DEPENDENT
      key: csp.ravpn.connections[online]
      delay: '0'
      history: 7d
      value_type: FLOAT
      description: Sum of ravpn_connections with status=online across VPC and devices
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - ravpn_connections{status="online"}
      - type: JAVASCRIPT
        parameters:
        - |-
          var valueArr = JSON.parse(value);
          if (!valueArr.length) {
              return '';
          }
          return valueArr.reduce(function(acc,obj){
             return acc + parseFloat(obj['value']);
          },0);
      master_item:
        key: get.ravpn.metrics
