      lld_macro_paths:
      - lld_macro: '{#VPC_ID}'
        path: $.labels['vpc_id']
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - '{__name__=~"^ravpn_(connections|peers|users|devices)$",vpc_id=~".+"}'
      - type: JAVASCRIPT
        parameters:
        - |-
          var rows = JSON.parse(value);
          var seen = {};
          var result = [];
          rows.forEach(function(row) {
              var id = row.labels.vpc_id;
              var key = '$' + id;
              if (id && !seen[key]) {
                  seen[key] = true;
                  result.push({labels: {vpc_id: id}});
              }
          });
          return JSON.stringify(result);
