    - uuid: 3455e82443824c649c9ebe484a7900ed
      name: Operating system
      type: DEPENDENT
      key: csp.system.sw.os
      delay: '0'
      history: 7d
      trends: '0'
      value_type: CHAR
      inventory_link: OS
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - node_uname_info
        - label
        - version
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: get.csp.metrics
    - uuid: 4ec4546218ba46fea0d0e8ee56c53189
      name: System uptime
      type: DEPENDENT
      key: csp.system.uptime
      delay: '0'
      history: 7d
      trends: '0'
      units: uptime
      description: System uptime in 'N days, hh:mm:ss' format.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - '{__name__=~"^node_boot_time(?:_seconds)?$"}'
        - value
        - ''
      - type: JAVASCRIPT
        parameters:
        - |-
          //use boottime to calculate uptime
          return (Math.floor(Date.now()/1000)-Number(value));
      master_item:
        key: get.csp.metrics
      triggers:
      - uuid: 3a72aa1e6aaa4d7a8b3c4cb5ce597b1d
        expression: last(/BI.ZONE Secure SD-WAN. CSP-controller template/csp.system.uptime)<10m
