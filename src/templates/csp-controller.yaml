    - uuid: 6ffb6168a8394d3ca2a656d18543a8be
      name: Service discovery
      type: DEPENDENT
      key: csp.services.discov
      delay: '0'
      filter:
        evaltype: OR
        conditions:
        - macro: '{#SERVICE_NAME}'
          value: '{$SERVICE_LIST_01}'
          formulaid: A
        - macro: '{#SERVICE_NAME}'
          value: '{$SERVICE_LIST_02}'
          formulaid: B
        - macro: '{#SERVICE_NAME}'
          value: '{$SERVICE_LIST_03}'
          formulaid: C
        - macro: '{#SERVICE_NAME}'
          value: '{$SERVICE_LIST_04}'
          formulaid: D
        - macro: '{#SERVICE_NAME}'
          value: '{$SERVICE_LIST_05}'
          formulaid: E
        - macro: '{#SERVICE_NAME}'
          value: '{$SERVICE_LIST_06}'
          formulaid: F
      item_prototypes:
      - uuid: 898bcdd9e56440a8a47ad1e6ee384d59
        name: Auto-restart counter of {#SERVICE_NAME}
        type: DEPENDENT
        key: csp.rst.auto.count.service[{#SERVICE_NAME}]
        delay: '0'
        history: 7d
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - docker_container_restart_count{name="{#SERVICE_NAME}"}
          - value
          - ''
        master_item:
          key: get.csp.metrics
        trigger_prototypes:
        - uuid: 6a1d9b32a1aa48aa98c2067278ef5f46
          expression: last(/BI.ZONE Secure SD-WAN. CSP-controller template/csp.rst.auto.count.service[{#SERVICE_NAME}],#1)
            > avg(/BI.ZONE Secure SD-WAN. CSP-controller template/csp.rst.auto.count.service[{#SERVICE_NAME}],#5)
          name: HostServiceIsRestarting
          priority: HIGH
          description: Service {#SERVICE_NAME} is restarting for last 5 minute
      - uuid: a7431ecb9feb404f88789c6274320b91
        name: Status of {#SERVICE_NAME}
        type: DEPENDENT
        key: csp.stat.service[{#SERVICE_NAME}]
        delay: '0'
        history: 7d
        value_type: FLOAT
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - docker_container_running_state{name="{#SERVICE_NAME}"}
          - value
          - ''
        master_item:
          key: get.csp.metrics
      trigger_prototypes:
      - uuid: 59ba3308b7d04da885f31c6b2bda09aa
        expression: 'last(/BI.ZONE Secure SD-WAN. CSP-controller template/csp.stat.service[{#SERVICE_NAME}],#1)
          - last(/BI.ZONE Secure SD-WAN. CSP-controller template/csp.node.master, #1) < 0'
        name: HostServiceIsDown
        priority: HIGH
        description: Service {#SERVICE_NAME} in DOWN state for last 5 minute
        manual_close: 'YES'
      master_item:
        key: get.csp.metrics
      lld_macro_paths:
      - lld_macro: '{#SERVICE_NAME}'
        path: $.labels['name']
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - '{__name__=~"docker_container"}'
      overrides:
      - name: Set priority High
        step: '1'
        stop: STOP
        filter:
          conditions:
          - macro: '{#SERVICE_NAME}'
            value: net_tracker|acwsd|route|dcgw|so_renderer|sotm|soems|balancerint|balancerext|net_tracker|apigw|cpe_statusd|acmqsd|dnsmasq|acwsd|sorabbitmq|ntp_chrony|node_exporter|docker_exporter|mongo|redis|sodb|acdb
            formulaid: A
        operations:
        - operationobject: TRIGGER_PROTOTYPE
          operator: REGEXP
          value: Down|Restarting
          status: ENABLED
          discover: DISCOVER
          severity: HIGH
          tags:
          - tag: Severity
            value: High
      - name: Set priority Medium
        step: '2'
        stop: STOP
        filter:
          conditions:
          - macro: '{#SERVICE_NAME}'
            value: so_api|so_analytics_keeper|so_analytics_api|wi|acuirest|prometheusproxy|ws_msg_broker|us|wsbroker|so_clickhouse
            formulaid: A
        operations:
        - operationobject: TRIGGER_PROTOTYPE
          operator: REGEXP
          value: Down|Restarting
          status: ENABLED
          discover: DISCOVER
          severity: AVERAGE
          tags:
          - tag: Severity
            value: Medium
      - name: Set priority Warning
        step: '3'
        stop: STOP
        filter:
          conditions:
          - macro: '{#SERVICE_NAME}'
            value: apigw_audit|alertmanager|csp_manager|acuinotify|bss|cpe_uinotifyd|rabbitmq_exporter|toria|grafana|prometheusalertmanager|aria2|prometheus|mongodb_exporter|postgres_exporter|redis_exporter
            formulaid: A
        operations:
        - operationobject: TRIGGER_PROTOTYPE
          operator: REGEXP
          value: Down|Restarting
          status: ENABLED
          discover: DISCOVER
          severity: WARNING
          tags:
          - tag: Severity
            value: Warning
      - name: Set priority Low
        step: '4'
        stop: STOP
        filter:
          conditions:
          - macro: '{#SERVICE_NAME}'
            value: '{$SERVICE_LIST_01}|{$SERVICE_LIST_02}'
            formulaid: A
        operations:
        - operationobject: TRIGGER_PROTOTYPE
          operator: REGEXP
          value: Down|Restarting
          status: DISABLED
          discover: DISCOVER
          severity: INFO
          tags:
          - tag: Severity
            value: Low
    - uuid: 4cdb5e132a5345ee91b693d0474e9040
      name: Block devices discovery
      type: DEPENDENT
      key: csp.vfs.dev.discov
      delay: '0'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#DEVNAME}'
          value: '{$VFS.DEV.DEVNAME.MATCHES}'
          formulaid: A
        - macro: '{#DEVNAME}'
          value: '{$VFS.DEV.DEVNAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      item_prototypes:
      - uuid: c8948d6e09454ddda3f6f1f5554c28e0
        name: '{#DEVNAME}: Disk read request avg waiting time (r_await)'
        type: CALCULATED
        key: vfs.dev.read.await["{#DEVNAME}"]
        history: 7d
        value_type: FLOAT
        units: '!ms'
        params: (last(//vfs.dev.read.time.rate["{#DEVNAME}"])/(last(//vfs.dev.read.rate["{#DEVNAME}"])+(last(//vfs.dev.read.rate["{#DEVNAME}"])=0)))*1000*(last(//vfs.dev.read.rate["{#DEVNAME}"])
          > 0)
        description: This formula contains two boolean expressions that evaluates to 1 or 0 in order to set calculated
          metric to zero and to avoid division by zero exception.
      - uuid: 348d4c6a23774a899fd32a35b9271621
        name: '{#DEVNAME}: Disk read rate'
        type: DEPENDENT
        key: vfs.dev.read.rate["{#DEVNAME}"]
        delay: '0'
        history: 7d
        value_type: FLOAT
        units: '!r/s'
        description: r/s. The number (after merges) of read requests completed per second for the device.
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - node_disk_reads_completed_total{device="{#DEVNAME}"}
          - value
          - ''
        master_item:
          key: get.csp.metrics
      - uuid: 6f9d50ba8d6d43a9b077815a78cd7632
        name: '{#DEVNAME}: Disk read time (rate)'
        type: DEPENDENT
        key: vfs.dev.read.time.rate["{#DEVNAME}"]
        delay: '0'
        history: 7d
        value_type: FLOAT
        description: Rate of total read time counter. Used in r_await calculation
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - node_disk_read_time_seconds_total{device="{#DEVNAME}"}
          - value
          - ''
        master_item:
          key: get.csp.metrics
      - uuid: 69a023246e464e46b66e4397b6f53467
        name: '{#DEVNAME}: Disk write request avg waiting time (w_await)'
        type: CALCULATED
        key: vfs.dev.write.await["{#DEVNAME}"]
        history: 7d
        value_type: FLOAT
        units: '!ms'
        params: (last(//vfs.dev.write.time.rate["{#DEVNAME}"])/(last(//vfs.dev.write.rate["{#DEVNAME}"])+(last(//vfs.dev.write.rate["{#DEVNAME}"])=0)))*1000*(last(//vfs.dev.write.rate["{#DEVNAME}"])
          > 0)
        description: This formula contains two boolean expressions that evaluates to 1 or 0 in order to set calculated
          metric to zero and to avoid division by zero exception.
      - uuid: b533488cb0e8456ca994d066d1ff7713
        name: '{#DEVNAME}: Disk write rate'
        type: DEPENDENT
        key: vfs.dev.write.rate["{#DEVNAME}"]
        delay: '0'
        history: 7d
        value_type: FLOAT
        units: '!w/s'
        description: w/s. The number (after merges) of write requests completed per second for the device.
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - node_disk_writes_completed_total{device="{#DEVNAME}"}
          - value
          - ''
        master_item:
          key: get.csp.metrics
      - uuid: c50387ff103b49bf941c6b15fca91798
        name: '{#DEVNAME}: Disk write time (rate)'
        type: DEPENDENT
        key: vfs.dev.write.time.rate["{#DEVNAME}"]
        delay: '0'
        history: 7d
        value_type: FLOAT
        description: Rate of total write time counter. Used in w_await calculation
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - node_disk_write_time_seconds_total{device="{#DEVNAME}"}
          - value
          - ''
        master_item:
          key: get.csp.metrics
      trigger_prototypes:
      - uuid: ec2677080c754931a52419bd1b9ea091
        expression: min(/BI.ZONE Secure SD-WAN. CSP-controller template/vfs.dev.read.await["{#DEVNAME}"],15m) >
          {$VFS.DEV.READ.AWAIT.WARN:"{#DEVNAME}"} or min(/BI.ZONE Secure SD-WAN. CSP-controller template/vfs.dev.write.await["{#DEVNAME}"],15m)
          > {$VFS.DEV.WRITE.AWAIT.WARN:"{#DEVNAME}"}
        name: HostDiskRead/WriteTimeAreTooHigh
        priority: WARNING
        description: '{#DEVNAME}: Disk read/write request responses are too high (read > {$VFS.DEV.READ.AWAIT.WARN:"{#DEVNAME}"}
          ms for 15m or write > {$VFS.DEV.WRITE.AWAIT.WARN:"{#DEVNAME}"} ms for 15m)'
      master_item:
        key: get.csp.metrics
      lld_macro_paths:
      - lld_macro: '{#DEVNAME}'
        path: $.labels.device
      - lld_macro: '{#HELP}'
        path: $.help
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - node_disk_io_now{device=~".+"}
    - uuid: f821bf4a26e14b4b8237cef08b236bdd
      name: Mounted filesystem discovery
      type: DEPENDENT
      key: csp.vfs.fs.discov
      delay: '0'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#FSDEVICE}'
          value: '{$VFS.FS.FSDEVICE.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: A
        - macro: '{#FSNAME}'
          value: '{$VFS.FS.FSDEVICE.MATCHES}'
          formulaid: B
        - macro: '{#FSNAME}'
          value: '{$VFS.FS.FSNAME.MATCHES}'
          formulaid: C
        - macro: '{#FSNAME}'
          value: '{$VFS.FS.FSNAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: D
        - macro: '{#FSTYPE}'
          value: '{$VFS.FS.FSTYPE.MATCHES}'
          formulaid: E
        - macro: '{#FSTYPE}'
          value: '{$VFS.FS.FSTYPE.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: F
      description: Discovery of file systems of different types.
      item_prototypes:
      - uuid: 38ad6e54c63c47efa959bbd9f6f7ff31
        name: '{#FSNAME}: Free space'
        type: DEPENDENT
        key: vfs.fs.free["{#FSNAME}"]
        delay: '0'
        history: 7d
        value_type: FLOAT
        units: B
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - '{__name__=~"^node_filesystem_avail(?:_bytes)?$", mountpoint="{#FSNAME}"}'
          - value
          - ''
        master_item:
          key: get.csp.metrics
      - uuid: 336ff86f22d34f75a2e1a0b9fad341dc
        name: '{#FSNAME}: Free inodes in %'
        type: DEPENDENT
        key: vfs.fs.inode.pfree["{#FSNAME}"]
        delay: '0'
        history: 7d
        value_type: FLOAT
        units: '%'
        preprocessing:
        - type: PROMETHEUS_TO_JSON
          parameters:
          - '{__name__=~"node_filesystem_files.*",mountpoint="{#FSNAME}"}'
        - type: JAVASCRIPT
          parameters:
          - |-
            //count vfs.fs.inode.pfree
            var inode_free;
            var inode_total;
            JSON.parse(value).forEach(function(metric) {
              if (metric['name'] == 'node_filesystem_files'){
                  inode_total = metric['value'];
              } else if (metric['name'] == 'node_filesystem_files_free'){
                  inode_free = metric['value'];
              }
            });
            return (inode_free/inode_total)*100;
        master_item:
          key: get.csp.metrics
      - uuid: 218aefa0fd054ee197da6842dc80defb
        name: '{#FSNAME}: Space utilization %'
        type: CALCULATED
        key: vfs.fs.pused["{#FSNAME}"]
        history: 7d
        value_type: FLOAT
        units: '%'
        params: (last(//vfs.fs.used["{#FSNAME}"])/(last(//vfs.fs.total["{#FSNAME}"])))*100
        description: Space utilization in % for {#FSNAME}
        trigger_prototypes:
        - uuid: 7f00524e94ad4e7289d68782b946a06b
          expression: last(/BI.ZONE Secure SD-WAN. CSP-controller template/vfs.fs.pused["{#FSNAME}"],#5)>80
          name: '{#FSNAME}: HostLowDiskSpace'
          priority: WARNING
          manual_close: 'YES'
          dependencies:
          - name: '{#FSNAME}: HostOutOfDiskSpace'
            expression: last(/BI.ZONE Secure SD-WAN. CSP-controller template/vfs.fs.pused["{#FSNAME}"],#5)>90
        - uuid: 8354524940f94903a13e711fe3f9e200
          expression: last(/BI.ZONE Secure SD-WAN. CSP-controller template/vfs.fs.pused["{#FSNAME}"],#5)>90
          name: '{#FSNAME}: HostOutOfDiskSpace'
          priority: HIGH
          manual_close: 'YES'
      - uuid: 53a21d3db13c4e9fa918181886787987
        name: '{#FSNAME}: Total space'
        type: DEPENDENT
        key: vfs.fs.total["{#FSNAME}"]
        delay: '0'
        history: 7d
        value_type: FLOAT
        units: B
        description: Total space in Bytes
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - '{__name__=~"^node_filesystem_size(?:_bytes)?$", mountpoint="{#FSNAME}"}'
          - value
          - ''
        master_item:
          key: get.csp.metrics
      - uuid: 5f525f3fc37e48d88685c9b0616259bc
        name: '{#FSNAME}: Used space'
        type: CALCULATED
        key: vfs.fs.used["{#FSNAME}"]
        history: 7d
        value_type: FLOAT
        units: B
        params: (last(//vfs.fs.total["{#FSNAME}"])-last(//vfs.fs.free["{#FSNAME}"]))
        description: Used storage in Bytes
      graph_prototypes:
      - uuid: 201e1833fc274a428efc649030cc62a2
        name: '{#FSNAME}: Disk space usage'
        width: '600'
        height: '340'
        yaxismax: '0'
        show_work_period: 'NO'
        show_triggers: 'NO'
        type: PIE
        show_3d: 'YES'
        graph_items:
        - sortorder: '1'
          color: 1A7C11
          item:
            host: BI.ZONE Secure SD-WAN. CSP-controller template
            key: vfs.fs.total["{#FSNAME}"]
        - sortorder: '2'
          color: F63100
          item:
            host: BI.ZONE Secure SD-WAN. CSP-controller template
            key: vfs.fs.used["{#FSNAME}"]
      master_item:
        key: get.csp.metrics
      lld_macro_paths:
      - lld_macro: '{#FSDEVICE}'
        path: $.labels.device
      - lld_macro: '{#FSNAME}'
        path: $.labels.mountpoint
      - lld_macro: '{#FSTYPE}'
        path: $.labels.fstype
      - lld_macro: '{#HELP}'
        path: $.help
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - '{__name__=~"^node_filesystem_size(?:_bytes)?$", mountpoint=~".+"}'
    macros:
    - macro: '{$CSP_INSTANCE}'
      value: 172.31.254.1:9100
    - macro: '{$DOMAIN}'
      value: <example.com>
    - macro: '{$NET.IF.IFNAME.MATCHES}'
      value: ^.*$
    - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
      value: (^Software Loopback Interface|^NULL[0-9.]*$|^[Ll]o[0-9.]*$|^[Ss]ystem$|^Nu[0-9.]*$|^veth[0-9A-z]+$|docker[0-9]+|br-[a-z0-9]{12}|br-[a-z]{1,3}|^virbr[0-9])
      description: Filter out loopbacks, nulls, docker veth links and docker0 bridge by default
    - macro: '{$PROTO}'
      value: https
    - macro: '{$SERVICE_LIST_01}'
      value: initdb_so|initdb_so_post|migratedb|so_analytics_ch_migrator
      description: Tier 01
    - macro: '{$SERVICE_LIST_02}'
      value: loaddb
      description: Tier 02
    - macro: '{$SERVICE_LIST_03}'
      value: docker_exporter|node_exporter|postgres_exporter|process_exporter|rabbitmq_exporter|redis_exporter
      description: Tier 03
    - macro: '{$SERVICE_LIST_04}'
      value: csp_manager
      description: Tier 04
    - macro: '{$SERVICE_LIST_05}'
      value: aria2|grafana|prometheus|prometheusalertmanager|toria
      description: Tier 05
    - macro: '{$SERVICE_LIST_06}'
      value: acmqsd1|acmqsd2|actrackerd|acuinotify|acuirest|acwsd1|acwsd2|alertmanager|apigw|apigw_audit|balancerext|balancerint|bss|cpe_uinotifyd|dnsmasq|fqdn_resolver|fwsd|net_tracker|prometheusproxy|ravpn|so_analytics_api|so_analytics_keeper|so_api|so_ems|so_id_engine|so_renderer|so_tm|so_tm2|us|wi|wsbroker
      description: Tier 06
    - macro: '{$SSL_CERT}'
      value: portal-cert.pem
    - macro: '{$SSL_KEY}'
      value: portal-key.pem
    - macro: '{$VFS.DEV.DEVNAME.MATCHES}'
      value: .+
      description: This macro is used in block devices discovery. Can be overridden on the host or linked template
        level
    - macro: '{$VFS.DEV.DEVNAME.NOT_MATCHES}'
      value: ^(loop[0-9]*|sd[a-z][0-9]+|nbd[0-9]+|sr[0-9]+|fd[0-9]+|dm-[0-9]+|ram[0-9]+|ploop[a-z0-9]+|md[0-9]*|hcp[0-9]*|zram[0-9]*)
      description: This macro is used in block devices discovery. Can be overridden on the host or linked template
        level
    - macro: '{$VFS.DEV.READ.AWAIT.WARN}'
      value: '20'
      description: Disk read average response time (in ms) before the trigger would fire
    - macro: '{$VFS.DEV.WRITE.AWAIT.WARN}'
      value: '20'
      description: Disk write average response time (in ms) before the trigger would fire
    - macro: '{$VFS.FS.FSDEVICE.MATCHES}'
      value: ^.+$
    - macro: '{$VFS.FS.FSDEVICE.NOT_MATCHES}'
      value: ^\s$
    - macro: '{$VFS.FS.FSNAME.MATCHES}'
      value: .+
    - macro: '{$VFS.FS.FSNAME.NOT_MATCHES}'
      value: ^(/dev|/sys|/run|/proc|.+/shm$)
    - macro: '{$VFS.FS.FSTYPE.MATCHES}'
      value: ^(btrfs|ext2|ext3|ext4|reiser|xfs|ffs|ufs|jfs|jfs2|vxfs|hfs|apfs|refs|ntfs|fat32|zfs)$
    - macro: '{$VFS.FS.FSTYPE.NOT_MATCHES}'
      value: ^\s$
  triggers:
  - uuid: 78804e2f9fc04ee4b7b3bbdb6e93d931
    expression: last(/BI.ZONE Secure SD-WAN. CSP-controller template/csp.cpu.switches,#5) / last(/BI.ZONE Secure
      SD-WAN. CSP-controller template/csp.cpu.num) > 5000
    name: HostContextSwitching
    priority: WARNING
  - uuid: 0119d603061e480c8023aac744652c9f
    expression: min(/BI.ZONE Secure SD-WAN. CSP-controller template/csp.swap.pused,5m)>80 and last(/BI.ZONE
      Secure SD-WAN. CSP-controller template/csp.swap.total)>0
    name: HostSwapIsFillingUp
    priority: WARNING
    description: Swap space usage has remained above 80% for the last 5 minutes
