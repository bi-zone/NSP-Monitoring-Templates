    - uuid: 0872f3b2f09b475ab2f0bd08bec1dc5e
      name: Free swap space in %
      type: CALCULATED
      key: csp.swap.pfree
      history: 7d
      value_type: FLOAT
      units: '%'
      params: (last(//csp.swap.free)+count(//csp.swap.total,#1,"eq",0))/(last(//csp.swap.total)+count(//csp.swap.total,#1,"eq",0))*100
      description: The free space of swap volume/file in percent. Returns 100 when swap is not configured.
    - uuid: 0c1e2216b2b04474a3bae2e4c089826b
      name: Used swap space in %
      type: CALCULATED
      key: csp.swap.pused
      history: 7d
      value_type: FLOAT
      units: '%'
      params: (last(//csp.swap.total)-last(//csp.swap.free))/(last(//csp.swap.total)+count(//csp.swap.total,#1,"eq",0))*100
      description: The used space of swap volume/file in percent. Returns 0 when swap is not configured.
    - uuid: 0836665efb3b4d3e851ff561b2be0c2e
      name: Total swap space
      type: DEPENDENT
