    - uuid: 80edef31cc7644aeb82439a510424f1b
      name: 'Memory: utilization %'
      type: CALCULATED
      key: csp.mem.util
      history: 7d
      value_type: FLOAT
      units: '%'
      params: (last(//csp.mem.total)-last(//csp.mem.avail)) / last(//csp.mem.total)*100
      description: Memory used percentage is calculated as (total-available)/total*100
      triggers:
      - uuid: f813ff6bf81b48f1bcb40bfe6307e3e0
        expression: last(/BI.ZONE Secure SD-WAN. CSP-controller template/csp.mem.util,#5)>60
        name: HostLowMemory
        priority: WARNING
        description: 'Memory: usage more 60%'
        dependencies:
        - name: HostOutOfMemory
          expression: last(/BI.ZONE Secure SD-WAN. CSP-controller template/csp.mem.util,#5)>80
      - uuid: 264d2ca6ceab41c9b233d5bbbe935b5b
        expression: last(/BI.ZONE Secure SD-WAN. CSP-controller template/csp.mem.util,#5)>80
        name: HostOutOfMemory
        priority: HIGH
        description: 'Memory: usage more 80%'
