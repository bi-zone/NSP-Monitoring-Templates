        priority: HIGH
        description: 'CPU: usage more 80%'
      - uuid: 83ed9672e9f0403eaff7dcb98e322f38
        expression: last(/BI.ZONE Secure SD-WAN. CSP-controller template/csp.cpu.util,#5)>60
        name: HostHighCpuLoad
        priority: WARNING
        description: 'CPU: usage more 60%'
        dependencies:
