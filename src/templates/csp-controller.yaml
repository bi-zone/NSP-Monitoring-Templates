      - uuid: 3d12030f0cdd42a8b0b9e7fa241c59bc
        name: 'Interface {#IFNAME}:  Outbound error and drop rate'
        type: CALCULATED
        key: net.if.out.error_drop_rate[{#IFNAME}]
