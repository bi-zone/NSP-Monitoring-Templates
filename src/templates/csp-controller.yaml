    - uuid: 35a529210ba04cee9b8c047cb6a51454
      name: System description
      type: DEPENDENT
      key: csp.system.descr
      delay: '0'
      history: 7d
      trends: '0'
      value_type: CHAR
      description: Labeled system information as provided by the uname system call.
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - node_uname_info
      - type: JAVASCRIPT
        parameters:
        - |-
          var info = JSON.parse(value)[0];
             return info.labels.sysname+' version: '+info.labels.release+' '+info.labels.version
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: get.csp.metrics
    - uuid: 99d2f30697cf452887bbae0d391464ad
      name: System local time
