      history: 7d
      value_type: FLOAT
      units: '%'
      description: CPU utilization in %
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |-
          //Calculate utilization
          return (100 - value)
      master_item:
        key: csp.cpu.idle
      triggers:
      - uuid: 5afbb19f95234a9cae9baad5e7e680c2
        expression: last(/BI.ZONE Secure SD-WAN. CSP-controller template/csp.cpu.util,#5)>80
