zabbix_export:
  templates:
  - uuid: 98f3fd7ad7424829be1284b1f8c92579
    template: BI.ZONE Secure SD-WAN. CSP-controller template
    name: BI.ZONE Secure SD-WAN. CSP-controller template
    groups:
    - name: BI.ZONE Secure SD-WAN
    items:
    - uuid: 5eb8c493b0494512a759d1590a272a29
      name: Version of node_exporter running
      type: DEPENDENT
      key: csp.agent.version
      delay: '0'
      history: 7d
      trends: '0'
      value_type: CHAR
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - node_exporter_build_info
        - value
        - ''
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: get.csp.metrics
    - uuid: 9c3959b888434d1bbeff60019b286016
      name: 'CPU: guest'
      type: DEPENDENT
      key: csp.cpu.guest
      delay: '0'
      history: 7d
      value_type: FLOAT
      units: '%'
      description: Guest  time (time  spent  running  a  virtual  CPU  for  a  guest  operating  system)
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - '{__name__=~"^node_cpu(?:_guest_seconds_total)?$",cpu=~".+",mode=~"^(?:user|guest)$"}'
      - type: JAVASCRIPT
        parameters:
        - |-
          //calculates average, all cpu utilization
          var valueArr = JSON.parse(value);
          return valueArr.reduce(function(acc,obj){
             return acc + parseFloat(obj['value'])
          },0)/valueArr.length;
      - type: MULTIPLIER
        parameters:
        - '100'
      master_item:
        key: get.csp.metrics
    - uuid: de0503cb1e144ad68a0d62d78ed429a3
      name: 'CPU: guest nice'
      type: DEPENDENT
      key: csp.cpu.guest_nice
      delay: '0'
      history: 7d
      value_type: FLOAT
      units: '%'
      description: Time spent running a niced guest (virtual CPU for guest operating systems under the control of
