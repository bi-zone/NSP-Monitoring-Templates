        value_type: FLOAT
        units: '%'
        params: last(//net.if.speed[{#IFNAME}]) / last(//net.if.speed.max[{#IFNAME}]) * 100
      - uuid: e4b1d9539df64172990de9de4c25c7b0
        name: 'Interface {#IFNAME}: Speed'
        type: DEPENDENT
