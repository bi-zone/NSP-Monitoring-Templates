      - uuid: f3a8b2c1d4e5476980a1b2c3d4e5f601
        name: 'Network: input traffic raw octets on {#BZMON_INTERFACE_NAME}'
        type: DEPENDENT
        key: net.trfc.in.raw[{#BZMON_INTERFACE_NAME}]
        delay: '0'
        history: 7d
        trends: '0'
        value_type: FLOAT
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - collectd_bzmon_if_octets_rx_total{bzmon=~"{#BZMON_INTERFACE_NAME}"}
          - value
          - ''
        master_item:
          key: get.cpe.metrics
      - uuid: f3a8b2c1d4e5476980a1b2c3d4e5f602
        name: 'Network: output traffic raw octets on {#BZMON_INTERFACE_NAME}'
        type: DEPENDENT
        key: net.trfc.out.raw[{#BZMON_INTERFACE_NAME}]
        delay: '0'
        history: 7d
        trends: '0'
        value_type: FLOAT
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - collectd_bzmon_if_octets_tx_total{bzmon=~"{#BZMON_INTERFACE_NAME}"}
          - value
          - ''
        master_item:
          key: get.cpe.metrics
      - uuid: f3a8b2c1d4e5476980a1b2c3d4e5f603
        name: 'Network: input traffic rate on {#BZMON_INTERFACE_NAME}'
        type: CALCULATED
        key: net.trfc.in.rate[{#BZMON_INTERFACE_NAME}]
        delay: 1m
        history: 7d
        value_type: FLOAT
        units: bps
        params: (last(//net.trfc.in.raw[{#BZMON_INTERFACE_NAME}])-last(//net.trfc.in.raw[{#BZMON_INTERFACE_NAME}],#4))*8/180
      - uuid: f3a8b2c1d4e5476980a1b2c3d4e5f604
        name: 'Network: output traffic rate on {#BZMON_INTERFACE_NAME}'
        type: CALCULATED
        key: net.trfc.out.rate[{#BZMON_INTERFACE_NAME}]
        delay: 1m
        history: 7d
        value_type: FLOAT
        units: bps
        params: (last(//net.trfc.out.raw[{#BZMON_INTERFACE_NAME}])-last(//net.trfc.out.raw[{#BZMON_INTERFACE_NAME}],#4))*8/180
      graph_prototypes:
      - uuid: c4d5e6f7a8b94012a3b4c5d6e7f80901
        name: 'Network: traffic rate on {#BZMON_INTERFACE_NAME}'
        graph_items:
        - sortorder: '1'
          color: 1A7C11
          item:
            host: BI.ZONE Secure SD-WAN. CyberEdge
            key: net.trfc.out.rate[{#BZMON_INTERFACE_NAME}]
        - sortorder: '2'
          color: 0040FF
          item:
            host: BI.ZONE Secure SD-WAN. CyberEdge
            key: net.trfc.in.rate[{#BZMON_INTERFACE_NAME}]
      master_item:
        key: get.cpe.metrics
      lld_macro_paths:
      - lld_macro: '{#BZMON_INTERFACE_NAME}'
        path: $.labels['bzmon']
      - lld_macro: '{#CPE_ID}'
        path: $.labels['cpe_id']
      - lld_macro: '{#ERROR_TYPE}'
        path: $.labels['exported_type']
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - '{__name__=~"^collectd_bzmon_if"}'
      - type: STR_REPLACE
        parameters:
        - lan0 lan LAN
        - lan0
      - type: STR_REPLACE
        parameters:
        - wan1 wan1 WAN1
        - wan1
      - type: STR_REPLACE
        parameters:
        - wan2 wan2 WAN2
        - wan2
    - uuid: 0f8a7c2d6b5149a3a7c9e2d4f6b8a1c3
      name: Physical interface discovery
      type: DEPENDENT
      key: phys.net.discov
      delay: '0'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#PHYS_IFNAME}'
          value: ^eth[0-9]+$
