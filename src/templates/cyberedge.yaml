    - uuid: 5f04a99170bc4a08b550757938fd806e
      name: 'Memory: used %'
      type: CALCULATED
      key: cpe.mem.used.perc
      history: 7d
      value_type: FLOAT
      params: last(//cpe.mem.used) / last(//cpe.mem.total) * 100
