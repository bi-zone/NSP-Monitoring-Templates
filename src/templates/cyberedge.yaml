        - value
        - ''
      master_item:
        key: get.cpe.metrics
      triggers:
      - uuid: da38dd0b23444ca49eeae365d249fcd1
        expression: last(/BI.ZONE Secure SD-WAN. CyberEdge/cpe.contr.ses.percent)>60
        name: HostLocalSessionRateIncreased
        priority: WARNING
        description: |-
          Local session limit is > 60%

          More details:
          {$PROTO}://ui.{$DOMAIN}/ui/networking/cpes/{#CPE_ID}/dashboard
    - uuid: a02be286f49b4bcb988c74178d142047
      name: 'CPU: idle'
      type: DEPENDENT
      key: cpe.cpu.idle
      delay: '0'
      history: 7d
      value_type: FLOAT
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - '{__name__=~"^collectd_cpu_percent$", cpu=~".+", exported_type="idle"}'
      - type: JAVASCRIPT
        parameters:
        - |-
          //calculates average, all cpu utilization
          var valueArr = JSON.parse(value);
          return valueArr.reduce(function(acc,obj){
             return acc + parseFloat(obj['value'])
          },0)/valueArr.length;
      master_item:
        key: get.cpe.metrics
      triggers:
      - uuid: f622eb4848a04e5d87dad0e06430c5bb
        expression: last(/BI.ZONE Secure SD-WAN. CyberEdge/cpe.cpu.idle,#5)<20
        name: HostCriticalCpuLoad
        priority: HIGH
        description: |-
          CPU usage > 80%

          More details:
          {$PROTO}://ui.{$DOMAIN}/ui/networking/cpes/{#CPE_ID}/dashboard
      - uuid: 880ea0f44c5a4a1aaea781abebf95832
        expression: last(/BI.ZONE Secure SD-WAN. CyberEdge/cpe.cpu.idle,#5)<40
        name: HostHighCpuLoad
        priority: WARNING
        description: |-
          CPU usage > 60%

          More details:
          {$PROTO}://ui.{$DOMAIN}/ui/networking/cpes/{#CPE_ID}/dashboard
        dependencies:
        - name: HostCriticalCpuLoad
          expression: last(/BI.ZONE Secure SD-WAN. CyberEdge/cpe.cpu.idle,#5)<20
