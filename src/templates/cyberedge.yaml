    - uuid: b43d41352c6a441798cbe4b10c74ac61
      name: Get CPE metrics
      type: HTTP_AGENT
      key: get.cpe.metrics
      history: '0'
      trends: '0'
      value_type: TEXT
      timeout: 30s
      url: '{$PROTO}://mon.{$DOMAIN}/mon/cpe-metrics'
      query_fields:
      - name: match[]
        value: '{job="node",kind="cpe",cpe_id="{$CPE_ID}"}'
      ssl_cert_file: '{$SSL_CERT}'
      ssl_key_file: '{$SSL_KEY}'
    discovery_rules:
    - uuid: e21e944d08d64aee99fc279fc6658106
      name: Network interface discovery (bzmon)
      type: DEPENDENT
      key: bz.net.discov
      delay: '0'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#BZMON_INTERFACE_NAME}'
          value: (lo|wan1 [A-Z0-9]{15}|wan2 [A-Z0-9]{15}|^ lan$|dp_wan)
          operator: NOT_MATCHES_REGEX
          formulaid: A
      item_prototypes:
      - uuid: 572030d4e33f403f8dafff8f7ca51dba
        name: 'Network: Collisions on {#BZMON_INTERFACE_NAME}'
        type: DEPENDENT
        key: net.collsn[{#BZMON_INTERFACE_NAME}]
        delay: '0'
        value_type: FLOAT
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - collectd_bzmon_if_collisions_total{bzmon=~"{#BZMON_INTERFACE_NAME}"}
          - value
          - ''
        master_item:
          key: get.cpe.metrics
        trigger_prototypes:
        - uuid: 25d2eed6579c4bfe862a36e9474a41a6
          expression: last(/BI.ZONE Secure SD-WAN. CyberEdge/net.collsn[{#BZMON_INTERFACE_NAME}],#5)>0
          name: HostNetworkColllisions
          priority: WARNING
          description: |-
            More details:
            {$PROTO}://ui.{$DOMAIN}/ui/networking/cpes/{$CPE_ID}/dashboard
      - uuid: 57df5649161f4ba8b4d03d6ab3abda98
        name: 'Network: IN drops on {#BZMON_INTERFACE_NAME}'
        type: DEPENDENT
        key: net.in.drop[{#BZMON_INTERFACE_NAME}]
        delay: '0'
        value_type: FLOAT
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - collectd_bzmon_if_dropped_rx_total{bzmon=~"{#BZMON_INTERFACE_NAME}"}
          - value
          - ''
        master_item:
          key: get.cpe.metrics
        trigger_prototypes:
        - uuid: ec74ae243f9f4fc78a739a83b8b5d2de
          expression: last(/BI.ZONE Secure SD-WAN. CyberEdge/net.in.drop[{#BZMON_INTERFACE_NAME}],#5)>10
          name: HostNetworkDropsIN
