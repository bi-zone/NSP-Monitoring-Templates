      key: cpe.mem.total
      history: 7d
      value_type: FLOAT
      units: B
      params: last(//cpe.mem.cach) + last(//cpe.mem.free) + last(//cpe.mem.buff) + last(//cpe.mem.used)
    - uuid: adbcb64a67814b3ab9190268b11bc50b
      name: 'Memory: used'
      type: DEPENDENT
