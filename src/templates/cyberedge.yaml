    - uuid: dfe8253842774c308390f9b64ec7f552
      name: Host availiablilty
      type: DEPENDENT
      key: cpe.avail.status
      delay: '0'
      history: 7d
      value_type: FLOAT
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - up
        - value
        - ''
      master_item:
        key: get.cpe.metrics
      triggers:
      - uuid: b3b30dd2595d44df9ed8f00a93344bf5
        expression: last(/BI.ZONE Secure SD-WAN. CyberEdge/cpe.avail.status,#5)=0
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/BI.ZONE Secure SD-WAN. CyberEdge/cpe.avail.status,#5)=1
        name: HostDown
        priority: HIGH
        description: |-
          More details:
          {$PROTO}://ui.{$DOMAIN}/ui/networking/cpes/{#CPE_ID}/dashboard
    - uuid: 2bf729c83bd2431a8b81459aaad85da7
      name: 'Conntrack sessions: MAX'
      type: DEPENDENT
      key: cpe.conntr.ses.max
      delay: '0'
      history: 7d
      value_type: FLOAT
