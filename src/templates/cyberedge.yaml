          expression: last(/BI.ZONE Secure SD-WAN. CyberEdge/cpe.mem.used.perc,#5)>80
      - uuid: c72231c0b3884c6aa7e5594acea91862
        expression: last(/BI.ZONE Secure SD-WAN. CyberEdge/cpe.mem.used.perc,#5)>80
        name: HostOutOfMemory
        priority: HIGH
